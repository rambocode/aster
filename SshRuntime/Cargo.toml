[package]
name = "aster-ssh"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Aster 原生 SSH 运行时（broker + client + ssh_config），移植自 tty7"
publish = false

[[bin]]
name = "aster-ssh"
path = "src/main.rs"

[dependencies]
russh = "0.62"
russh-sftp = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
libc = "0.2"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
