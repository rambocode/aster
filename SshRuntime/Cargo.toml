[package]
name = "aster-ssh"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Aster 原生 SSH 运行时（broker + client + ssh_config），移植自 tty7"
publish = false

[[bin]]
name = "aster-ssh"
path = "src/main.rs"

[dependencies]
russh = "0.62"
russh-sftp = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
libc = "0.2"
anyhow = "1"
thiserror = "2"
# 以下四个都已经是 russh 的传递依赖，不引入新代码：
# known_hosts 的 hashed 条目（HMAC-SHA1 + base64）与秘密内存清零。
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
