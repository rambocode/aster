<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
  macOS 应用图标几何:图稿是满幅 1024×1024 圆角矩形(rx≈230,约 22.4%,Apple
  squircle 比例)。macOS 26 会给 Dock 图标套自己的圆角遮罩,满幅底板才能和
  相邻图标等大;macOS 14/15 没有遮罩,则直接显示图稿自带的圆角。
  注意:母版必须用保留 alpha 的矢量渲染器(scripts/build-app.sh 用
  rsvg-convert -b none)。Quick Look 缩略图会把 SVG 合成到不透明白页上,
  四角变成白色,在圆角遮罩下会露出白框。
  品牌底色为统一珊瑚色,前景仅用白色,保证 Dock 小尺寸下仍有足够对比度。
  -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="#EA6D49"/>

  <!-- 前景直接使用 1024 网格坐标:底板从 824 内缩改成满幅后,原先 0.805 的
       缩入正好等价于 1:1,相对留白与旧图稿一致。 -->
  <!-- 独立提示符表示终端入口；圆角端点与主轨道保持相同视觉语言。 -->
  <path
    d="M156 260 278 356 156 452"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="52"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!--
    连续轨道表示 Prompt、工具调用和结果回流。右下收束成回转箭头，同时保留
    足够大的内部留白，避免缩小后与中央星芒粘连。
  -->
  <path
    d="M684 676
       C754 586 794 488 768 398
       C731 272 597 231 474 286
       C349 342 284 466 307 592
       C331 724 445 797 572 800
       C670 802 756 779 860 748
       L860 610"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="52"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 四向星芒是 Aster 与 AI 辅助能力的共同识别核心。Dock「任务进行时旋转」
         只旋转这一层，几何中心为 (548, 530)。 -->
  <path
    d="M548 405
       C558 480 599 520 674 530
       C599 540 558 580 548 655
       C538 580 497 540 422 530
       C497 520 538 480 548 405Z"
    fill="#FFFFFF"
  />
</svg>
