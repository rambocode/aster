<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    macOS 应用图标几何:系统不会自动加圆角遮罩,图稿自带 824×824 圆角矩形
    (Apple 标准网格,四周各 100px 透明边距,圆角半径 ≈185),否则 Dock 里
    会是一块与系统图标格格不入的直角色块。品牌底色为统一珊瑚色,前景仅用
    白色,保证 Dock 小尺寸下仍有足够对比度。
  -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#EA6D49"/>

  <!-- 内容按 0.805 等比缩入圆角底面,保持原 1024 网格上的构图比例。 -->
  <g transform="translate(512 512) scale(0.805) translate(-512 -512)">
    <!-- 独立提示符表示终端入口；圆角端点与主轨道保持相同视觉语言。 -->
    <path
      d="M156 260 278 356 156 452"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="52"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!--
      连续轨道表示 Prompt、工具调用和结果回流。右下收束成回转箭头，同时保留
      足够大的内部留白，避免缩小后与中央星芒粘连。
    -->
    <path
      d="M684 676
         C754 586 794 488 768 398
         C731 272 597 231 474 286
         C349 342 284 466 307 592
         C331 724 445 797 572 800
         C670 802 756 779 860 748
         L860 610"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="52"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 四向星芒是 Aster 与 AI 辅助能力的共同识别核心。 -->
    <path
      d="M548 405
         C558 480 599 520 674 530
         C599 540 558 580 548 655
         C538 580 497 540 422 530
         C497 520 538 480 548 405Z"
      fill="#FFFFFF"
    />
  </g>
</svg>
